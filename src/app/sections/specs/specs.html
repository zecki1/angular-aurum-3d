<section id="specs" class="specs secao" aria-labelledby="specs-titulo">
  <div class="specs-cabecalho" data-aos="fade-up">
    <p class="eyebrow">Ficha técnica</p>
    <h2 id="specs-titulo" class="titulo-secao">
      Cada detalhe,<br /><em>medido à mão.</em>
    </h2>
    <p class="specs-peca">Ficha técnica de {{ selecionado().nome }}</p>
  </div>

  <div class="specs-grade" [appSpecReveal]="42">
    @for (espec of selecionado().especificacoes; track espec.rotulo; let i = $index) {
      <div class="specs-item" [style.--item-cor]="selecionado().cor">
        <span class="specs-indice" aria-hidden="true">0{{ i + 1 }}</span>
        <p class="specs-rotulo">{{ espec.rotulo }}</p>
        <p class="specs-valor">{{ espec.valor }}</p>
      </div>
    }
  </div>
</section>
